<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNI 染前對照圖 · 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea; --card:#ffffff; --ink:#2a1f1a; --brown:#3a2c23;
    --gold:#c4a882; --gold-dark:#a08660; --gold-soft:#e8dcc8;
    --muted:#9a8f82; --line:#ece3d6; --danger:#b5523f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;padding-bottom:48px;}

  .hero{background:linear-gradient(160deg,#2a1f1a,#3a2c23);color:#fff;padding:34px 24px 28px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(196,168,130,.18),transparent 60%);}
  .hero-mark{font-family:'Noto Serif TC',serif;font-size:12px;letter-spacing:.42em;color:var(--gold);margin-bottom:10px;position:relative;}
  .hero-title{font-family:'Noto Serif TC',serif;font-size:23px;font-weight:600;letter-spacing:.06em;position:relative;}
  .hero-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:8px;position:relative;}

  .wrap{max-width:540px;margin:0 auto;padding:24px 18px 0;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:20px;box-shadow:0 2px 14px rgba(58,44,35,.05);}
  .panel-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:600;color:var(--brown);margin-bottom:16px;display:flex;align-items:center;gap:8px;}

  label{display:block;font-size:12.5px;color:var(--gold-dark);font-weight:500;margin:14px 0 6px;letter-spacing:.03em;}
  input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px;color:var(--ink);background:#fdfbf7;transition:border .2s;}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold);}
  textarea{resize:vertical;min-height:54px;}

  /* 選圖區 */
  .pick{border:1.5px dashed var(--gold);border-radius:11px;padding:22px;text-align:center;cursor:pointer;background:rgba(196,168,130,.06);transition:background .2s;}
  .pick:active{background:rgba(196,168,130,.14);}
  .pick-ico{font-size:30px;}
  .pick-text{font-size:13px;color:var(--gold-dark);margin-top:6px;}
  .pick-hint{font-size:11px;color:var(--muted);margin-top:3px;}
  #fileInput{display:none;}
  .preview{margin-top:14px;display:none;}
  .preview img{width:100%;border-radius:9px;border:1px solid var(--line);}
  .preview .up-state{font-size:12px;text-align:center;margin-top:8px;color:var(--muted);}

  .btn{width:100%;border:none;border-radius:9px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:all .2s;margin-top:18px;}
  .btn-main{background:var(--ink);color:var(--gold);border:1px solid var(--gold-dark);}
  .btn-main:active{transform:translateY(1px);}
  .btn-main:disabled{opacity:.45;cursor:not-allowed;}

  .msg{font-size:13px;text-align:center;margin-top:12px;padding:10px;border-radius:8px;display:none;}
  .msg.ok{display:block;background:rgba(125,160,110,.12);color:#5a7548;}
  .msg.err{display:block;background:rgba(181,82,63,.1);color:var(--danger);}

  /* 現有列表 */
  .glist-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .glist-item:last-child{border-bottom:none;}
  .glist-thumb{width:46px;height:46px;flex:none;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#f0e8da;}
  .glist-meta{flex:1;min-width:0;}
  .glist-name{font-size:13.5px;font-weight:500;color:var(--brown);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .glist-desc{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .glist-del{flex:none;background:none;border:1px solid var(--line);color:var(--danger);border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit;}
  .glist-del:active{background:rgba(181,82,63,.08);}
  .glist-loading{text-align:center;color:var(--muted);font-size:12.5px;padding:18px;}

  .lock-note{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.7;}

  /* 🔐 D-37 E2：登入閘 */
  .login-panel{text-align:center;}
  .login-panel p{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:var(--ink);border:1px solid var(--gold);}
  .btn-google img{width:16px;height:16px;}
  .who{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:14px;}
  .who button{background:none;border:none;color:var(--gold-dark);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:11.5px;margin-left:6px;}
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-mark">UNI HAIR DESIGN</div>
    <h1 class="hero-title">染前對照圖 · 後台</h1>
    <div class="hero-sub">上傳對照圖，自動同步到染前精靈卡4</div>
  </header>

  <div class="wrap">

    <!-- 🔐 D-37 E2：未登入時只顯示登入鈕 -->
    <div class="panel login-panel" id="loginWrap">
      <div class="panel-title" style="justify-content:center;">🔐 請先登入後台</div>
      <p>使用與後台 admin 相同的 Google 帳號</p>
      <button class="btn btn-google" onclick="pageLogin()"><img src="https://www.google.com/favicon.ico" alt="">以 Google 登入</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div id="appWrap" style="display:none;">
    <div class="who">已登入：<span id="whoEmail"></span><button type="button" onclick="pageLogout()">登出</button></div>

    <!-- 新增 -->
    <div class="panel">
      <div class="panel-title">➕ 新增一張對照圖</div>

      <div class="pick" id="pickBox" onclick="document.getElementById('fileInput').click()">
        <div class="pick-ico">🖼️</div>
        <div class="pick-text">點此選擇對照圖</div>
        <div class="pick-hint">建議橫式對照圖（左右對比）</div>
      </div>
      <input type="file" id="fileInput" accept="image/*">

      <div class="preview" id="preview">
        <img id="previewImg" alt="預覽">
        <div class="up-state" id="upState"></div>
      </div>

      <label>標題</label>
      <input type="text" id="title" placeholder="例：暗 vs 亮（同樣白髮）">

      <label>小說明（選填）</label>
      <input type="text" id="desc" placeholder="例：左深色對比突兀 · 右淡亮霧色自然共存">

      <button class="btn btn-main" id="submitBtn" onclick="submitImg()" disabled>送出新增</button>
      <div class="msg" id="msg"></div>
    </div>

    <!-- 現有列表 -->
    <div class="panel">
      <div class="panel-title">📋 目前的對照圖</div>
      <div id="glist"><div class="glist-loading">載入中…</div></div>
    </div>

    </div><!-- /appWrap -->

    <div class="lock-note">此頁僅供 Elsa 管理使用<br>請勿外流網址</div>
  </div>

  <script>
    // ===== 設定（比照使用指南後台，僅改 action / token / Sheet）=====
    var GAS_URL    = 'https://script.google.com/macros/s/AKfycbyG9T1UodoV3Zzag9OtC7SQDTiS3DfsqZFE1i7PrXSGxg_AW5C_GvOcmVgNOvlL3g6WQQ/exec';
    var TOKEN      = 'uni_bleach_2026';
    var CLOUD_NAME = 'dvti8ug8s';
    var PRESET     = 'uni_hair';   // unsigned upload preset（與使用指南共用）

    // ═══ 🔐 D-37 E2 後台會話攔截器（與 admin.html 同一段；只攔主系統 GAS_URL）═══
    (function(){
      if (window.__aaFetchInstalled) return; window.__aaFetchInstalled = true;
      const MAIN = GAS_URL, DOTS = '.'.repeat(200), rawFetch = window.fetch.bind(window);
      let aak = '', minting = null, warned = false;
      function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
      function banner(j){
        let el = document.getElementById('aa-banner');
        if(!el){ el = document.createElement('div'); el.id = 'aa-banner';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b3261e;color:#fff;padding:10px 40px 10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));font-size:.8rem;line-height:1.55;box-shadow:0 2px 8px rgba(0,0,0,.25);';
          document.body.appendChild(el); }
        const why = j.why || '';
        let msg = '🔒 後台驗證失敗，請重新整理並重新登入後台。';
        if(why === '此帳號不在允許名單') msg = '🔒 此帳號不在允許名單' + (j.email ? '（' + escHtml(j.email) + '）' : '') + '。到 Apps Script「顧客追蹤」點開 m_drr_api.gs，函式選 DRR_api_trustLastRejected 按執行，再回來重新整理。';
        else if(why === 'gen' || j.error === 'gen') msg = '🔒 後台會話機制停用。到 Apps Script「顧客追蹤」點開 m_admin_auth.gs，函式選 ADMAUTH_genReset 按執行，再回來重新整理。';
        else if(j.error === 'envelope' || j.error === 'conflict') msg = '🔒 請求格式錯誤，請重新整理頁面後再試。';
        el.innerHTML = msg + '<button type="button" onclick="this.parentNode.remove()" style="position:absolute;right:8px;top:calc(4px + env(safe-area-inset-top,0px));background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;">×</button>';
      }
      async function mint(force){
        if(aak && !force) return aak;
        if(force) aak = '';
        if(minting) return minting;
        minting = (async () => {
          try{
            const tok = window.drrIdToken ? await window.drrIdToken() : '';
            if(!tok) return '';
            const body = new URLSearchParams(); body.append('action','aaSession'); body.append('idToken', tok);
            const r = await rawFetch(MAIN, { method:'POST', body, redirect:'follow' });
            const j = await r.json();
            if(j && j.ok && j.aak) aak = j.aak;
            else if(j && (j.error === 'unauth' || j.error === 'gen')) banner(j);
          }catch(_){}
          return aak;
        })();
        try{ return await minting; } finally { minting = null; }
      }
      function headersObj(h){ const o = {}; if(!h) return o; if(h instanceof Headers){ h.forEach((v,k)=>{ o[k]=v; }); } else Object.assign(o, h); return o; }
      function isForm(init){ const h = headersObj(init && init.headers); return Object.keys(h).some(k => k.toLowerCase()==='content-type' && /x-www-form-urlencoded/i.test(h[k])); }
      function asForm(init){ const i2 = Object.assign({}, init), h = headersObj(init.headers); let has = false;
        Object.keys(h).forEach(k => { if(k.toLowerCase()==='content-type'){ h[k] = 'application/x-www-form-urlencoded;charset=UTF-8'; has = true; } });
        if(!has) h['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8'; i2.headers = h; return i2; }
      function build(url, init, k){
        if(!k) return [url, init];
        const method = String(init.method || 'GET').toUpperCase();
        if(method === 'GET') return [url + (url.indexOf('?') >= 0 ? '&' : '?') + 'aak=' + k, init];
        const b = init.body;
        if(b instanceof URLSearchParams){
          if(b.has('idToken') || b.has('aak') || b.has('_')) return [url, init];
          const i2 = asForm(init); i2.body = '_=' + DOTS + '&aak=' + k + '&' + b.toString(); return [url, i2];
        }
        if(typeof b === 'string'){
          if(b.charAt(0) === '{'){
            try{ const o = JSON.parse(b);
              if(o && typeof o === 'object' && !Array.isArray(o) && Object.keys(o).length && !('aak' in o) && !('_' in o)){
                const i2 = Object.assign({}, init); i2.body = '{"_":"' + DOTS + '","aak":"' + k + '",' + b.slice(1); return [url, i2]; }
            }catch(_){}
            return [url, init];
          }
          if(isForm(init) && !/(^|&)(idToken|aak|_)=/.test(b)){ const i2 = Object.assign({}, init); i2.body = '_=' + DOTS + '&aak=' + k + '&' + b; return [url, i2]; }
          return [url, init];
        }
        if(b != null && !warned){ warned = true; console.warn('[D-37] 未支援的 body 型別，原樣送出'); }
        return [url, init];
      }
      async function peek(r){ try{ const t = await r.clone().text(); if(t.length > 800 || t.indexOf('"error"') < 0) return null; return JSON.parse(t); }catch(_){ return null; } }
      window.fetch = async function(input, init){
        const url = (typeof input === 'string') ? input : '';
        if(!url || url.indexOf(MAIN) !== 0) return rawFetch(input, init);
        const base = init || {};
        let k = await mint(false);
        let [u, i] = build(url, base, k);
        let r = await rawFetch(u, i);
        const j = await peek(r);
        if(j && j.error === 'unauth' && j.why === 'session'){
          k = await mint(true);
          if(k){ [u, i] = build(url, base, k); r = await rawFetch(u, i); const j2 = await peek(r); if(j2 && j2.error) banner(j2); }
          else banner(j);
        } else if(j && ['unauth','envelope','conflict','gen'].indexOf(j.error) >= 0) banner(j);
        return r;
      };
    })();
    // ═══ 🔐 D-37 攔截器 END ═══

    var uploadedUrl = '';

    // ===== 選圖 + 上傳 Cloudinary =====
    document.getElementById('fileInput').addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      var pv = document.getElementById('preview');
      var pvImg = document.getElementById('previewImg');
      var st = document.getElementById('upState');
      var btn = document.getElementById('submitBtn');

      pvImg.src = URL.createObjectURL(file);
      pv.style.display = 'block';
      st.textContent = '⏳ 上傳中…';
      st.style.color = '#9a8f82';
      uploadedUrl = '';
      btn.disabled = true;

      var fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', PRESET);

      fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', {method:'POST', body:fd})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d.secure_url){
            uploadedUrl = d.secure_url;
            st.textContent = '✅ 圖片已上傳';
            st.style.color = '#5a7548';
            btn.disabled = false;
          } else {
            st.textContent = '❌ 上傳失敗：' + (d.error && d.error.message ? d.error.message : '請重試');
            st.style.color = '#b5523f';
          }
        })
        .catch(function(){
          st.textContent = '❌ 上傳失敗，請檢查網路後重試';
          st.style.color = '#b5523f';
        });
    });

    // ===== 送出新增（寫進 Sheet）=====
    function submitImg(){
      var title = document.getElementById('title').value.trim();
      var desc  = document.getElementById('desc').value.trim();
      var msg   = document.getElementById('msg');
      var btn   = document.getElementById('submitBtn');

      if(!uploadedUrl){ showMsg('請先選擇並上傳圖片', false); return; }
      if(!title){ showMsg('請填寫標題', false); return; }

      btn.disabled = true; btn.textContent = '送出中…';

      var url = GAS_URL + '?action=saveBleachImg'
        + '&token=' + encodeURIComponent(TOKEN)
        + '&img='   + encodeURIComponent(uploadedUrl)
        + '&title=' + encodeURIComponent(title)
        + '&desc='  + encodeURIComponent(desc)
        + '&t=' + Date.now();

      fetch(url, {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(function(d){
          btn.textContent = '送出新增';
          if(d && d.ok){
            showMsg('✅ 已新增！染前精靈卡4 已同步更新', true);
            resetForm();
            loadList();
          } else {
            showMsg('❌ 新增失敗：' + (d && d.msg ? d.msg : '請重試'), false);
            btn.disabled = false;
          }
        })
        .catch(function(){
          btn.textContent = '送出新增';
          showMsg('❌ 連線失敗，請重試', false);
          btn.disabled = false;
        });
    }

    function resetForm(){
      uploadedUrl = '';
      document.getElementById('title').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('preview').style.display = 'none';
      document.getElementById('fileInput').value = '';
      document.getElementById('submitBtn').disabled = true;
    }

    function showMsg(t, ok){
      var m = document.getElementById('msg');
      m.textContent = t;
      m.className = 'msg ' + (ok ? 'ok' : 'err');
      if(ok) setTimeout(function(){ m.className = 'msg'; }, 4000);
    }

    // ===== 現有列表 + 刪除 =====
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    function loadList(){
      var box = document.getElementById('glist');
      fetch(GAS_URL + '?action=getBleachImgs&t=' + Date.now(), {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(function(d){
          var imgs = (d && d.imgs) || [];
          if(!d || !d.ok || !imgs.length){
            box.innerHTML = '<div class="glist-loading">目前尚無對照圖</div>';
            return;
          }
          var html = '';
          imgs.forEach(function(g){
            html += '<div class="glist-item">'
              + '<img class="glist-thumb" src="'+esc(g.img)+'" alt="">'
              + '<div class="glist-meta">'
              +   '<div class="glist-name">'+esc(g.title)+'</div>'
              +   '<div class="glist-desc">'+esc(g.desc||'')+'</div>'
              + '</div>'
              + '<button class="glist-del" onclick="delImg('+g.order+', this)">刪除</button>'
              + '</div>';
          });
          box.innerHTML = html;
        })
        .catch(function(){ box.innerHTML = '<div class="glist-loading">載入失敗</div>'; });
    }

    function delImg(order, btn){
      if(!confirm('確定刪除這張對照圖？')) return;
      btn.textContent = '刪除中…'; btn.disabled = true;
      fetch(GAS_URL + '?action=deleteBleachImg&token=' + encodeURIComponent(TOKEN) + '&order=' + order + '&t=' + Date.now(), {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d && d.ok){ loadList(); }
          else { alert('刪除失敗：' + (d && d.msg ? d.msg : '請重試')); btn.textContent='刪除'; btn.disabled=false; }
        })
        .catch(function(){ alert('連線失敗'); btn.textContent='刪除'; btn.disabled=false; });
    }

    // 🔐 D-37 E2：登入後才載入列表（見 pageLogin）
  </script>

  <!-- 🔐 D-37 E2：Firebase 登入（與 admin.html 同一組專案與允許名單）；回滾：以 D-37 前版本覆蓋本頁 -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInWithPopup, signOut, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    const app = initializeApp({apiKey:"AIzaSyBIjbjkdA7h-rzZK4RKMBEwMNUg9R3kMqY",authDomain:"uni-hair-shop.firebaseapp.com",projectId:"uni-hair-shop",storageBucket:"uni-hair-shop.firebasestorage.app",messagingSenderId:"643874710249",appId:"1:643874710249:web:9910edcffda00c9d53c678"});
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    window.drrIdToken = async () => (auth.currentUser ? await auth.currentUser.getIdToken() : '');
    window.pageLogin = async () => {
      const m = document.getElementById('loginMsg');
      m.className = 'msg';
      try {
        await signInWithPopup(auth, provider);
        document.getElementById('loginWrap').style.display = 'none';
        document.getElementById('appWrap').style.display = 'block';
        document.getElementById('whoEmail').textContent = (auth.currentUser && auth.currentUser.email) || '';
        loadList();
      } catch (e) {
        m.textContent = '登入失敗：' + e.message; m.className = 'msg err';
      }
    };
    window.pageLogout = async () => {
      await signOut(auth);
      location.reload();
    };
  </script>

</body>
</html>
